# Website no servidor AZAFT — estatico, isolado (porta 3313).
services:
  website:
    build:
      context: .
    image: inpulse-website:latest
    container_name: inpulse-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:3313:3313"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3313/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
