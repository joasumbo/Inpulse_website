name: Deploy Website (AZAFT)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-website
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: "20m"
          script: bash /opt/inpulse-website/deploy.sh
